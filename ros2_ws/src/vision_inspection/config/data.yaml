# 이미지와 라벨은 레포 루트의 train_set/에 두고, 정의 파일만 이 패키지가 관리한다.
#
# path 키는 일부러 두지 않는다. ultralytics는 path가 없을 때 이 yaml이 있는 폴더를
# 데이터셋 루트로 삼는다(ultralytics/data/utils.py:518). path에 상대경로를 적으면
# yaml 위치가 아니라 실행 시 CWD 기준으로 풀리고, 없으면 조용히 ~/datasets 아래로
# 폴백해서 "이미지를 못 찾음"으로 끝난다.
#
# 아래 경로는 이 파일 기준이다: config → vision_inspection → src → ros2_ws → 레포 루트
#
# 촬영 세션 폴더를 추가하면 train/val 양쪽에 한 줄씩 같이 넣는다. 한 폴더를 통째로
# val로 돌리면 검증셋이 한 종류로 치우치므로 폴더마다 나눠서 담는다.
# no_ball은 라벨 파일이 없다 — ultralytics가 배경(negative) 이미지로 학습에 쓴다.
train:
  - ../../../../train_set/1_ball1/images/train
  - ../../../../train_set/1_ball2/images/train
  - ../../../../train_set/2_ball1/images/train
  - ../../../../train_set/3_ball1/images/train
  - ../../../../train_set/no_ball/images/train
val:
  - ../../../../train_set/1_ball1/images/val
  - ../../../../train_set/1_ball2/images/val
  - ../../../../train_set/2_ball1/images/val
  - ../../../../train_set/3_ball1/images/val
  - ../../../../train_set/no_ball/images/val

names:
  0: ball
