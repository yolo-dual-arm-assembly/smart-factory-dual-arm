# 바구니 검사 설정. 코드를 고치지 않고 여기만 바꾼다.
#
# 여기 적는 클래스 이름은 학습된 모델이 실제로 내놓는 이름(= data.yaml의
# names)과 글자 그대로 같아야 한다. 다르면 아무것도 세지 못해 개수가 늘 0이
# 되고, 그 결과 항상 REJECT가 난다. 검사기는 시작할 때 모델의 이름 목록과
# 대조해 어긋나는 이름을 경고로 알린다.

# ── 기준 수량 ────────────────────────────────────────────────────────
# 바구니에 있어야 할 공 개수. 이 숫자와 다르면 REJECT(누락/중복 투입).
# 통합 제어기가 아직 이 값을 넘겨 주지 않아서 여기 둔다. 제어기가 넘기기
# 시작하면 그쪽 값이 우선한다.
# null로 두면 개수 검사를 하지 않고 불량·오투입만 본다.
target_count: 1

# ── 클래스 이름 ──────────────────────────────────────────────────────
# 공. 개수로 센다.
ball_names: [ball]

# 공 자체의 불량(흠집 등). 하나라도 있으면 REJECT.
# 지금은 불량 라벨을 만들지 않기로 해서 비워 둔다.
defect_names: []

# 오투입 — 공이 아닌 물건. 하나라도 있으면 REJECT.
# 종류를 나누지 않고 others 한 클래스로 라벨링하기로 팀에서 정했다.
foreign_names: [others]

# 불량으로 잡힌 공을 '공 한 개'로도 셀지.
#   true  — 정상/불량을 라벨로 나눈 경우(ball_ok/ball_ng). 불량도 공이므로 센다
#   false — 결함을 공 위에 겹쳐 표시한 경우. 더하면 같은 공을 두 번 센다
count_defects_as_balls: true
